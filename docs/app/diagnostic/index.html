<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>G-Systems — maintenance</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="theme-color" content="#07080D" />
<link rel="icon" href="../icone-180.png" />
<style>
  html, body { margin: 0; min-height: 100%; background: #07080D; color: #F4F4F0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; justify-content: center;
    padding: 32px 28px calc(32px + env(safe-area-inset-bottom)); }
  .marque { font-size: 40px; font-weight: 700; letter-spacing: -1px; margin: 0 0 28px; }
  .marque b { color: #E5231F; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { font-size: 16px; line-height: 1.5; color: #C9CBD6; margin: 0 0 14px; }
  .rassure { background: #12141B; border: 1px solid #2F3340; border-radius: 12px; padding: 14px 16px; color: #F4F4F0; }
  button { margin-top: 18px; width: 100%; padding: 15px; border: 0; border-radius: 12px; cursor: pointer;
    font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #7C3AED, #C026D3); }
  button:focus-visible { outline: 3px solid #C4B5FD; outline-offset: 3px; }
</style>
</head>
<body>
<!-- MAINTENANCE : page d'entrée remplacée ; le code de l'app, le service worker
     et les données du téléphone (localStorage, IndexedDB) ne sont pas touchés.
     Pour rétablir : annuler ce commit (git revert). -->
<main role="status">
  <div class="marque" aria-label="G-Systems"><b>g</b>systems</div>
  <h1>Application en maintenance</h1>
  <p>G-Systems est momentanément indisponible, le temps d'une mise à jour.</p>
  <p class="rassure">Vos données restent sur ce téléphone : rien n'est perdu. L'application reviendra ici même, sans rien réinstaller.</p>
  <p>Besoin urgent ? Contactez votre responsable.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
